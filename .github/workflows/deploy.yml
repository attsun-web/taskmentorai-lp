name: Deploy to Xserver

# dist/ をビルドして id-lab.net/TaskMentorAI/ へ FTPS 転送する。
# 事前に GitHub の Settings → Secrets and variables → Actions で以下を登録すること。
#   FTP_SERVER   : エックスサーバーの FTP ホスト名（例 sv0000.xserver.jp）
#   FTP_USERNAME : FTP ユーザー名
#   FTP_PASSWORD : FTP パスワード

# FTP ログインが 530 で通らないため、push トリガーは無効にしてある。
# FTP 制限設定・パスワードを解決したら push トリガーを戻すこと。
on:
  workflow_dispatch:

env:
  # エックスサーバーの FTP はルート直下にドメイン名のディレクトリが並ぶ構成。
  # 実際のパスがこれと異なる場合はここを書き換える。
  FTP_SERVER_DIR: /id-lab.net/public_html/TaskMentorAI/

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # パッケージマネージャは yarn 4 固定
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # base を /TaskMentorAI/ にしてビルド（サブディレクトリ配信のため）
      - name: Build
        run: yarn build:deploy

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          # Vite のマニフェストは公開不要
          exclude: |
            **/.vite/**
