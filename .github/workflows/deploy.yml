name: Deploy to Xserver

# dist/ をビルドして id-lab.net/portfolio/taskmentorai/ へ FTPS 転送する。
#
# エックスサーバーの「国外IPアクセス制限設定」が有効だと、海外IPで動く GitHub Actions の
# ランナーからは FTP 接続が遮断され、Deploy ステップが Timeout (control socket) で失敗する。
# サーバーパネル →「国外IPアクセス制限設定」で FTP の制限を OFF にしておくこと。
#
# Settings → Secrets and variables → Actions に以下が必要。
#   FTP_SERVER   : エックスサーバーの FTP ホスト名（例 sv0000.xserver.jp）
#   FTP_USERNAME : FTP ユーザー名
#   FTP_PASSWORD : FTP パスワード

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # エックスサーバーの FTP はルート直下にドメイン名のディレクトリが並ぶ構成。
  # 実際のパスがこれと異なる場合はここを書き換える。
  FTP_SERVER_DIR: /id-lab.net/public_html/portfolio/taskmentorai/

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # パッケージマネージャは yarn 4 固定
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # base を /portfolio/taskmentorai/ にしてビルド（サブディレクトリ配信のため）
      - name: Build
        run: yarn build:deploy

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          # Vite のマニフェストは公開不要
          exclude: |
            **/.vite/**
